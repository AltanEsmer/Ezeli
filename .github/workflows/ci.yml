name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:size
      - name: Start the local Supabase
        # The image registry sometimes rate-limits and the runner sometimes has the
        # database port still bound; both pass on a second try.
        run: |
          for attempt in 1 2 3; do
            pnpm exec supabase start && exit 0
            pnpm exec supabase stop --no-backup || true
            sleep 20
          done
          exit 1
      - name: Install FFmpeg for clip fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
